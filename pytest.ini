# `python -m pytest` from the repo root: the tests in serve/ and tools/ that need no GPU and no model download.
# test_*.py only: tools/ also holds *_test.py scripts that run against a live engine.
# tools/test_iq_pack.py needs llama.cpp's gguf-py (setup.py clones it, or $STRATA_GGUF_PY), and is skipped without it.
[pytest]
testpaths = serve tools
python_files = test_*.py
